<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Chart — sesiones por día</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #05070A; color: #E6EDF3;
    font-family: "IBM Plex Mono", "Courier New", monospace;
    padding: 24px 14px 60px; min-height: 100vh;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  .eyebrow { font-size: 11px; letter-spacing: .18em; color: #F0A202; text-transform: uppercase; }
  h1 { font-size: 24px; margin: 2px 0 4px; }
  .sub { font-size: 11px; color: #6E7681; margin-bottom: 20px; line-height: 1.5; }
  .panel {
    background: #0D1117; border: 1px solid #21262D; border-radius: 8px;
    padding: 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;
    margin-bottom: 16px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  label { font-size: 10px; color: #8B949E; text-transform: uppercase; letter-spacing: .08em; }
  input, select {
    background: #161B22; border: 1px solid #30363D; border-radius: 5px;
    padding: 9px 10px; color: #E6EDF3; font-family: inherit; font-size: 14px;
  }
  #symbol { width: 100px; text-transform: uppercase; }
  #sessions { width: 70px; }
  button {
    background: #F0A202; color: #05070A; border: none; border-radius: 5px;
    padding: 10px 18px; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  #status { font-size: 12px; margin-bottom: 12px; min-height: 18px; }
  #status.err { color: #FFA198; background: #2D1214; border: 1px solid #5A1E20; border-radius: 6px; padding: 10px 12px; }
  #status.ok { color: #6E7681; }
  .day { margin-bottom: 26px; }
  .dayhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .dayhead .date { font-size: 14px; font-weight: 700; color: #E6EDF3; text-transform: uppercase; }
  .badge { font-size: 12px; font-weight: 700; }
  .daystats { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
  .stat .l { font-size: 9px; color: #6E7681; text-transform: uppercase; letter-spacing: .08em; }
  .stat .v { font-size: 12px; font-weight: 700; }
  .daychart { border: 1px solid #21262D; border-radius: 8px; overflow: hidden; height: 240px; }
  .foot { font-size: 10px; color: #484F58; margin-top: 4px; }
  .up { color: #3FB950; } .down { color: #F85149; } .hot { color: #F0A202; }
  .sumpanel { background: #0D1117; border: 1px solid #21262D; border-radius: 8px; padding: 14px; margin-bottom: 22px; }
  .sumtitle { font-size: 11px; letter-spacing: .14em; color: #F0A202; text-transform: uppercase; margin-bottom: 10px; }
  .tabwrap { overflow-x: auto; }
  .sumtab { width: 100%; border-collapse: collapse; font-size: 11px; }
  .sumtab th { text-align: left; color: #6E7681; font-weight: 400; text-transform: uppercase; font-size: 9px; letter-spacing: .06em; padding: 3px 8px 6px 0; }
  .sumtab td { padding: 4px 8px 4px 0; border-top: 1px solid #161B22; white-space: nowrap; }
  .sumline { font-size: 11px; color: #8B949E; margin-top: 8px; line-height: 1.5; }
  .reading { font-size: 11px; color: #A8B3BE; background: #0D1117; border-left: 2px solid #F0A202; border-radius: 0 6px 6px 0; padding: 9px 11px; margin-bottom: 8px; line-height: 1.6; }
  .sumhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .sumhead .sumtitle { margin-bottom: 0; }
  .copybtn { background: #161B22; color: #E6EDF3; border: 1px solid #30363D; border-radius: 5px; padding: 6px 12px; font-family: inherit; font-size: 11px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Sesiones por día</div>
  <h1>Session Chart</h1>
  <div class="sub">Las últimas N sesiones regulares (9:30–16:00 ET), cada día en su propio gráfico. Punteada gris = cierre anterior · línea ámbar = VWAP.</div>

  <div class="panel">
    <div class="field">
      <label for="symbol">Símbolo</label>
      <input id="symbol" value="MU">
    </div>
    <div class="field">
      <label for="date">Hasta la fecha</label>
      <input id="date" type="date">
    </div>
    <div class="field">
      <label for="sessions">Sesiones</label>
      <input id="sessions" type="number" min="1" max="10" value="5">
    </div>
    <div class="field">
      <label for="interval">Intervalo</label>
      <select id="interval">
        <option value="1m">1 min (≤ 30 días atrás, más lento)</option>
        <option value="5m" selected>5 min (≤ 60 días atrás)</option>
        <option value="15m">15 min (≤ 60 días atrás)</option>
        <option value="30m">30 min (≤ 60 días atrás)</option>
      </select>
    </div>
    <div class="field">
      <label for="statwin">Estadística de horas</label>
      <select id="statwin">
        <option value="win" selected>Solo ventana mostrada</option>
        <option value="30">Últimos 30 días</option>
        <option value="60">Últimos 60 días</option>
      </select>
    </div>
    <button id="go">Ver sesiones</button>
  </div>

  <div id="status" class="ok">Elige símbolo, fecha final y cuántas sesiones, luego "Ver sesiones".</div>
  <div id="summary"></div>
  <div id="charts"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
const ET = "America/New_York";
const OPEN_MIN = 9*60 + 30, CLOSE_MIN = 16*60;
const YBASE = "https://query1.finance.yahoo.com/v8/finance/chart/";

(function(){
  const d = new Date(); d.setDate(d.getDate()-1);
  document.getElementById("date").value = d.toISOString().slice(0,10);
})();

function etOffsetMs(unixSec){
  const d = new Date(unixSec*1000);
  const p = new Intl.DateTimeFormat("en-US",{timeZone:ET,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).formatToParts(d);
  const g = t => Number(p.find(x=>x.type===t).value);
  const asUtc = Date.UTC(g("year"), g("month")-1, g("day"), g("hour")%24, g("minute"), g("second"));
  return asUtc - unixSec*1000;
}
function etMins(unixSec){
  const p = new Intl.DateTimeFormat("en-US",{timeZone:ET,hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date(unixSec*1000));
  const g = t => Number(p.find(x=>x.type===t).value);
  return (g("hour")%24)*60 + g("minute");
}
function etDateStr(unixSec){
  return new Intl.DateTimeFormat("en-CA",{timeZone:ET,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(unixSec*1000));
}
function esDayLabel(ds){
  const parts = ds.split("-").map(Number);
  const dt = new Date(Date.UTC(parts[0], parts[1]-1, parts[2], 16, 0, 0));
  const w = new Intl.DateTimeFormat("es",{timeZone:ET,weekday:"short"}).format(dt);
  return w.toUpperCase().replace(".","") + " " + parts[2] + "/" + parts[1] + "/" + parts[0];
}
function fmtSigned(x, pct){
  const s = x>=0 ? "+" : "";
  return s + x.toFixed(2) + " (" + s + pct.toFixed(2) + "%)";
}
function fmtVol(v){
  if (v >= 1e9) return (v/1e9).toFixed(2) + "B";
  if (v >= 1e6) return (v/1e6).toFixed(1) + "M";
  if (v >= 1e3) return (v/1e3).toFixed(0) + "K";
  return String(Math.round(v));
}
// rows[].time is ET-shifted, so UTC getters give ET wall clock
function hhmm(t){
  const d = new Date(t*1000);
  return String(d.getUTCHours()).padStart(2,"0") + ":" + String(d.getUTCMinutes()).padStart(2,"0");
}
function bucketFromMins(mins){
  if (mins < 630) return "la apertura (9:30–10:30)";
  if (mins < 720) return "media mañana (10:30–12:00)";
  if (mins < 840) return "el mediodía (12:00–14:00)";
  if (mins < 900) return "la tarde (14:00–15:00)";
  return "la última hora (15:00–16:00)";
}
function bucketName(t){
  const d = new Date(t*1000);
  return bucketFromMins(d.getUTCHours()*60 + d.getUTCMinutes());
}

// ---- métricas de trader por sesión (rows: velas ET-shifted, prev: cierre anterior o null) ----
function computeDayMetrics(rows, prev){
  const o = rows[0].open, c = rows[rows.length-1].close;
  let hiRow = rows[0], loRow = rows[0], vTot = 0;
  let cumPV = 0, cumV = 0;
  const vwapData = [];
  for (const rr of rows){
    if (rr.high > hiRow.high) hiRow = rr;
    if (rr.low < loRow.low) loRow = rr;
    vTot += rr.volume;
    const tp = (rr.high + rr.low + rr.close) / 3;
    cumPV += tp * rr.volume; cumV += rr.volume;
    vwapData.push({ time: rr.time, value: cumV ? cumPV/cumV : tp });
  }
  const hi = hiRow.high, lo = loRow.low;
  const vwap = vwapData[vwapData.length-1].value;
  const range = hi - lo;
  const clv = range > 0 ? (c - lo)/range*100 : 50;

  // opening range: primeros 15 minutos
  const t0 = rows[0].time, orEnd = t0 + 15*60;
  let orHi = null, orLo = null;
  for (const rr of rows){
    if (rr.time < orEnd){
      orHi = orHi==null ? rr.high : Math.max(orHi, rr.high);
      orLo = orLo==null ? rr.low  : Math.min(orLo, rr.low);
    }
  }
  let orBreak = null;
  if (orHi != null){
    for (const rr of rows){
      if (rr.time < orEnd) continue;
      if (rr.high > orHi){ orBreak = { dir: "up", time: rr.time }; break; }
      if (rr.low < orLo){ orBreak = { dir: "down", time: rr.time }; break; }
    }
  }

  // gap y cierre de gap
  let gap = null, gapFill = null;
  if (prev != null){
    gap = o - prev;
    if (Math.abs(gap) > 1e-9){
      for (const rr of rows){
        if ((gap > 0 && rr.low <= prev) || (gap < 0 && rr.high >= prev)){ gapFill = rr.time; break; }
      }
    }
  }

  // % de velas cerrando sobre el VWAP acumulado
  let above = 0;
  for (let i=0;i<rows.length;i++){ if (rows[i].close >= vwapData[i].value) above++; }
  const pctAboveVwap = rows.length ? above/rows.length*100 : 0;

  return { o, c, hi, lo, hiT: hiRow.time, loT: loRow.time, vTot, vwap, vwapData,
           range, clv, orHi, orLo, orBreak, gap, gapFill, pctAboveVwap };
}

// ---- lectura automática por sesión ----
function dayNarrative(x){
  const p = [];
  if (x.gap != null && Math.abs(x.gap) > 1e-9){
    const gp = x.gap/x.prev*100;
    let g = "Abrió con gap " + (x.gap>0?"alcista":"bajista") + " de " + (x.gap>0?"+":"") + gp.toFixed(2) + "%";
    g += x.gapFill
      ? ", cerrado a las " + hhmm(x.gapFill) + " (el precio volvió al cierre anterior)"
      : " que no se cerró en toda la sesión";
    p.push(g + ".");
  } else if (x.gap != null){
    p.push("Abrió prácticamente plano vs el cierre anterior.");
  }
  if (x.orHi != null){
    if (x.orBreak) p.push("Rompió el rango de apertura (OR15) " + (x.orBreak.dir==="up"?"al alza":"a la baja") + " a las " + hhmm(x.orBreak.time) + ".");
    else p.push("Nunca rompió el rango de los primeros 15 minutos: sesión sin dirección definida.");
  }
  if (x.pctAboveVwap >= 70) p.push("Día con sesgo comprador: " + x.pctAboveVwap.toFixed(0) + "% de las velas cerraron sobre el VWAP.");
  else if (x.pctAboveVwap <= 30) p.push("Día con sesgo vendedor: solo " + x.pctAboveVwap.toFixed(0) + "% de las velas cerraron sobre el VWAP.");
  else p.push("Día de rango: el precio osciló alrededor del VWAP (" + x.pctAboveVwap.toFixed(0) + "% de velas por encima).");
  p.push("Máximo " + x.hi.toFixed(2) + " a las " + hhmm(x.hiT) + "; mínimo " + x.lo.toFixed(2) + " a las " + hhmm(x.loT) + " (rango " + x.rangePct.toFixed(2) + "%).");
  if (x.clv >= 70) p.push("Cierre fuerte, al " + x.clv.toFixed(0) + "% del rango: compradores en control hasta la campana.");
  else if (x.clv <= 30) p.push("Cierre débil, al " + x.clv.toFixed(0) + "% del rango: lo vendieron hacia el final.");
  else p.push("Cierre en la mitad del rango (" + x.clv.toFixed(0) + "%), sin ganador claro.");
  if (x.rvol != null){
    if (x.rvol >= 1.5) p.push("Volumen destacado: RVOL " + x.rvol.toFixed(2) + "x vs la ventana, supera el umbral de 1.5x.");
    else if (x.rvol <= 0.7) p.push("Volumen bajo (RVOL " + x.rvol.toFixed(2) + "x): movimiento con poca participación.");
    else p.push("Volumen dentro de lo normal (RVOL " + x.rvol.toFixed(2) + "x).");
  }
  return p.join(" ");
}

function windowNarrative(n, hiB, loB, trend, overVwap, gapsFilled, gapsTot, avgRangePct){
  const p = [];
  p.push("Ventana de " + n + " sesiones: " + overVwap + " cerraron sobre su VWAP.");
  p.push("Los máximos se concentraron en " + hiB.best + " (" + hiB.n + "/" + n + ") y los mínimos en " + loB.best + " (" + loB.n + "/" + n + ").");
  if (gapsTot > 0) p.push("Gaps: " + gapsFilled + " de " + gapsTot + " se cerraron durante la sesión.");
  p.push("Volumen " + trend + "; rango promedio por sesión " + avgRangePct.toFixed(2) + "%.");
  return p.join(" ");
}

let lastReport = "";

const PROXIES = [
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u),
];

// Orden de intento: backend propio (si la página vive en un servidor),
// Yahoo directo, y proxies públicos como último recurso.
function candidateUrls(sym, p1, p2, interval){
  const y = YBASE + encodeURIComponent(sym)
    + "?period1=" + p1 + "&period2=" + p2 + "&interval=" + interval + "&includePrePost=false";
  const list = [];
  if (location.protocol === "https:" || location.protocol === "http:"){
    list.push("/api/chart?symbol=" + encodeURIComponent(sym)
      + "&period1=" + p1 + "&period2=" + p2 + "&interval=" + interval);
  }
  list.push(y);
  for (const p of PROXIES) list.push(p(y));
  return list;
}

async function fetchChartData(sym, p1, p2, interval){
  const urls = candidateUrls(sym, p1, p2, interval);
  let lastErr;
  for (const u of urls){
    try {
      const res = await fetch(u);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const json = await res.json();
      if (json && json.chart) return json;
      throw new Error("respuesta inesperada");
    } catch(e){ lastErr = e; }
  }
  throw new Error("Todas las fuentes de datos fallaron (" + (lastErr && lastErr.message || "?") + "). Revisa tu conexión o inténtalo de nuevo en un minuto.");
}

async function fetchRange(sym, p1, p2, interval, onStatus){
  const chunks = [];
  if (interval === "1m"){
    const step = 6*86400;
    for (let a=p1; a<p2; a+=step) chunks.push([a, Math.min(a+step, p2)]);
  } else {
    chunks.push([p1, p2]);
  }
  const bars = [];
  for (let ci=0; ci<chunks.length; ci++){
    if (onStatus) onStatus("Cargando datos… (" + (ci+1) + "/" + chunks.length + ")");
    const json = await fetchChartData(sym, chunks[ci][0], chunks[ci][1], interval);
    if (json.chart.error) throw new Error(json.chart.error.description || "error de la API");
    const r = json.chart.result && json.chart.result[0];
    if (!r || !r.timestamp) continue;
    const q = r.indicators.quote[0];
    for (let i=0;i<r.timestamp.length;i++){
      if (q.open[i]==null || q.close[i]==null) continue;
      bars.push({ t: r.timestamp[i], open: q.open[i], high: q.high[i], low: q.low[i], close: q.close[i], volume: q.volume[i] || 0 });
    }
  }
  bars.sort((a,b)=>a.t-b.t);
  return bars;
}

// Estadística extendida (5m, chunked, best-effort): una fila por sesión COMPLETA
async function extendedStats(sym, endMid, days, onStatus){
  const p2 = endMid + 30*3600;
  const p1 = endMid - days*86400;
  const step = 30*86400;
  const chunks = [];
  for (let a=p1; a<p2; a+=step) chunks.push([a, Math.min(a+step, p2)]);
  const bars = [];
  for (let i=0;i<chunks.length;i++){
    if (onStatus) onStatus("Análisis extendido… (" + (i+1) + "/" + chunks.length + ")");
    try {
      const json = await fetchChartData(sym, chunks[i][0], chunks[i][1], "5m");
      const r = json.chart.result && json.chart.result[0];
      if (!r || !r.timestamp) continue;
      const q = r.indicators.quote[0];
      for (let k=0;k<r.timestamp.length;k++){
        if (q.high[k]==null || q.low[k]==null || q.close[k]==null) continue;
        bars.push({ t: r.timestamp[k], high: q.high[k], low: q.low[k], close: q.close[k], volume: q.volume[k] || 0 });
      }
    } catch(e) { /* datos parciales están bien */ }
  }
  const byDay = new Map();
  for (const b of bars){
    const mins = etMins(b.t);
    if (mins < OPEN_MIN || mins > CLOSE_MIN) continue;
    const ds = etDateStr(b.t);
    if (!byDay.has(ds)) byDay.set(ds, []);
    byDay.get(ds).push(b);
  }
  const out = [];
  byDay.forEach((rs, ds) => {
    if (rs.length < 70) return; // solo sesiones completas
    let hiR = rs[0], loR = rs[0], v = 0, dayHi = -Infinity, dayLo = Infinity;
    for (const rr of rs){
      if (rr.high > hiR.high) hiR = rr;
      if (rr.low < loR.low) loR = rr;
      if (rr.high > dayHi) dayHi = rr.high;
      if (rr.low < dayLo) dayLo = rr.low;
      v += rr.volume;
    }
    const lastC = rs[rs.length-1].close;
    out.push({ ds, hiMins: etMins(hiR.t), loMins: etMins(loR.t), vTot: v,
               rangePct: lastC ? (dayHi - dayLo)/lastC*100 : 0 });
  });
  out.sort((a,b)=> a.ds < b.ds ? -1 : 1);
  return out;
}

let dayCharts = [];

function clearCharts(){
  for (const c of dayCharts){ try { c.remove(); } catch(e){} }
  dayCharts = [];
  document.getElementById("charts").innerHTML = "";
}

function makeDayChart(el, rows, prevClose, vwapData){
  const chart = LightweightCharts.createChart(el, {
    layout: { background: { color: "#0D1117" }, textColor: "#8B949E", fontFamily: "IBM Plex Mono, monospace", fontSize: 10 },
    grid: { vertLines: { color: "#161B22" }, horzLines: { color: "#161B22" } },
    rightPriceScale: { borderColor: "#21262D" },
    timeScale: { borderColor: "#21262D", timeVisible: true, secondsVisible: false },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    handleScroll: true, handleScale: true,
  });
  const candles = chart.addCandlestickSeries({
    upColor: "#3FB950", downColor: "#F85149",
    wickUpColor: "#3FB950", wickDownColor: "#F85149",
    borderVisible: false,
  });
  const volume = chart.addHistogramSeries({ priceFormat: { type: "volume" }, priceScaleId: "vol" });
  chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.85, bottom: 0 } });
  const vwapSeries = chart.addLineSeries({
    color: "#D29922", lineWidth: 1,
    priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
  });

  candles.setData(rows);
  volume.setData(rows.map(x => ({ time: x.time, value: x.volume, color: x.close >= x.open ? "rgba(63,185,80,.35)" : "rgba(248,81,73,.35)" })));
  vwapSeries.setData(vwapData);
  if (prevClose != null){
    candles.createPriceLine({ price: prevClose, color: "#8B949E", lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, title: "cierre ant." });
  }
  chart.timeScale().fitContent();
  new ResizeObserver(() => { chart.applyOptions({ width: el.clientWidth }); }).observe(el);
  return chart;
}

function stat(l, v, cls){
  return '<div class="stat"><div class="l">'+l+'</div><div class="v '+(cls||"")+'">'+v+'</div></div>';
}

async function run(){
  const btn = document.getElementById("go");
  const status = document.getElementById("status");
  const sym = document.getElementById("symbol").value.trim().toUpperCase();
  const dateStr = document.getElementById("date").value;
  const interval = document.getElementById("interval").value;
  let nSess = parseInt(document.getElementById("sessions").value, 10);
  if (!sym || !dateStr) return;
  if (!(nSess >= 1)) nSess = 5;
  nSess = Math.min(nSess, 10);

  btn.disabled = true;
  status.className = "ok";

  try {
    const parts = dateStr.split("-").map(Number);
    const endMid = Math.floor(Date.UTC(parts[0], parts[1]-1, parts[2], 4, 0, 0)/1000);
    const p2 = endMid + 30*3600;
    const calDays = Math.max(Math.ceil((nSess+1) * 1.7) + 4, 10);
    const p1 = endMid - calDays*86400;

    const bars = await fetchRange(sym, p1, p2, interval, msg => { status.textContent = msg; });

    const byDay = new Map();
    for (const b of bars){
      const mins = etMins(b.t);
      if (mins < OPEN_MIN || mins > CLOSE_MIN) continue;
      const ds = etDateStr(b.t);
      if (!byDay.has(ds)) byDay.set(ds, []);
      byDay.get(ds).push({
        time: Math.floor((b.t*1000 + etOffsetMs(b.t))/1000),
        open: b.open, high: b.high, low: b.low, close: b.close, volume: b.volume,
      });
    }
    const allDays = Array.from(byDay.keys()).filter(ds => ds <= dateStr).sort();
    if (!allDays.length) throw new Error("Sin sesiones para " + sym + " en ese rango (¿símbolo correcto? ¿fecha dentro del límite del intervalo?)");
    const shown = allDays.slice(-nSess);

    // ---- primer pase: métricas por día ----
    const perDay = [];
    for (const ds of shown){
      const rows = byDay.get(ds);
      const idx = allDays.indexOf(ds);
      let prev = null;
      if (idx > 0){
        const pd = byDay.get(allDays[idx-1]);
        prev = pd[pd.length-1].close;
      }
      const m = computeDayMetrics(rows, prev);
      perDay.push(Object.assign({ ds, rows, prev }, m));
    }
    const sumV = perDay.reduce((s,x)=>s+x.vTot,0);
    const avgV = sumV / perDay.length;
    for (const x of perDay){
      const denom = perDay.length > 1 ? (sumV - x.vTot)/(perDay.length-1) : null;
      x.rvol = denom ? x.vTot/denom : null;
      x.rangePct = x.c ? x.range/x.c*100 : 0;
    }

    // ---- segundo pase: render ----
    clearCharts();
    const container = document.getElementById("charts");
    for (const x of perDay){
      const sec = document.createElement("div");
      sec.className = "day";
      let head = '<div class="dayhead"><span class="date">' + esDayLabel(x.ds) + '</span>';
      if (x.prev != null){
        const chg = x.c - x.prev;
        head += '<span class="badge ' + (chg>=0?"up":"down") + '">' + fmtSigned(chg, chg/x.prev*100) + '</span>';
      }
      head += '</div>';

      const vsV = x.c - x.vwap;
      let stats = '<div class="daystats">'
        + stat("Open", x.o.toFixed(2))
        + stat("Close", x.c.toFixed(2))
        + stat("VWAP", x.vwap.toFixed(2) + " (" + (vsV>=0?"+":"") + (vsV/x.vwap*100).toFixed(2) + "%)", vsV>=0?"up":"down")
        + stat("% velas > VWAP", x.pctAboveVwap.toFixed(0) + "%", x.pctAboveVwap>=50?"up":"down");
      if (x.rvol != null){
        stats += stat("RVOL (vs ventana)", x.rvol.toFixed(2) + "x", x.rvol>=1.5 ? "hot" : "");
      }
      stats += stat("Rango", x.range.toFixed(2) + " (" + x.rangePct.toFixed(2) + "%)")
            +  stat("Cierre en rango", x.clv.toFixed(0) + "%", x.clv>=70?"up":(x.clv<=30?"down":""));
      if (x.gap != null){
        let gtxt = fmtSigned(x.gap, x.gap/x.prev*100);
        if (Math.abs(x.gap) > 1e-9) gtxt += x.gapFill ? " · cerrado " + hhmm(x.gapFill) : " · sin cerrar";
        stats += stat("Gap apertura", gtxt, x.gap>=0?"up":"down");
      }
      if (x.orHi != null){
        const ob = x.orBreak
          ? (x.orBreak.dir === "up" ? "↑ " : "↓ ") + hhmm(x.orBreak.time)
          : "dentro";
        stats += stat("OR15 " + x.orLo.toFixed(2) + "–" + x.orHi.toFixed(2), ob,
                      x.orBreak ? (x.orBreak.dir==="up"?"up":"down") : "");
      }
      const intra = x.c - x.o;
      stats += stat("Intradía (vs open)", fmtSigned(intra, intra/x.o*100), intra>=0?"up":"down");
      stats += '</div>';

      x.narrative = dayNarrative(x);
      const reading = '<div class="reading">' + x.narrative + '</div>';

      sec.innerHTML = head + stats + reading + '<div class="daychart"></div>';
      container.appendChild(sec);
      dayCharts.push(makeDayChart(sec.querySelector(".daychart"), x.rows, x.prev, x.vwapData));
    }

    // ---- resumen de la ventana ----
    let tabRows = "";
    for (const x of perDay){
      tabRows += '<tr><td>' + x.ds.slice(5) + '</td>'
        + '<td class="up">' + hhmm(x.hiT) + ' · ' + x.hi.toFixed(2) + '</td>'
        + '<td class="down">' + hhmm(x.loT) + ' · ' + x.lo.toFixed(2) + '</td>'
        + '<td>' + fmtVol(x.vTot) + '</td>'
        + '<td class="' + (x.rvol != null && x.rvol >= 1.5 ? "hot" : "") + '">' + (x.rvol != null ? x.rvol.toFixed(2) + "x" : "—") + '</td>'
        + '<td>' + x.rangePct.toFixed(2) + '%</td></tr>';
    }
    const modeOf = arr => {
      const m = {};
      for (const t of arr){ const b = bucketName(t); m[b] = (m[b]||0)+1; }
      let best = null;
      for (const k in m) if (best===null || m[k] > m[best]) best = k;
      return { best, n: best!==null ? m[best] : 0 };
    };
    const hiB = modeOf(perDay.map(x=>x.hiT));
    const loB = modeOf(perDay.map(x=>x.loT));
    let trend = "estable";
    if (perDay.length >= 3){
      const n = perDay.length, ys = perDay.map(x=>x.vTot);
      const mx = (n-1)/2, my = ys.reduce((a,b)=>a+b,0)/n;
      let num = 0, den = 0;
      for (let i=0;i<n;i++){ num += (i-mx)*(ys[i]-my); den += (i-mx)*(i-mx); }
      const swing = (den ? num/den : 0) * (n-1) / (my||1) * 100;
      if (swing > 15) trend = "en aumento (~+" + swing.toFixed(0) + "% a lo largo de la ventana)";
      else if (swing < -15) trend = "en descenso (~" + swing.toFixed(0) + "% a lo largo de la ventana)";
    }
    const overVwap = perDay.filter(x => x.c >= x.vwap).length;
    const gapsTot = perDay.filter(x => x.gap != null && Math.abs(x.gap) > 1e-9).length;
    const gapsFilled = perDay.filter(x => x.gapFill != null).length;
    const avgRangePct = perDay.reduce((s,x)=>s+x.rangePct,0)/perDay.length;

    const winText = windowNarrative(perDay.length, hiB, loB, trend, overVwap, gapsFilled, gapsTot, avgRangePct);

    document.getElementById("summary").innerHTML =
      '<div class="sumpanel">'
      + '<div class="sumhead"><div class="sumtitle">Resumen · últimas ' + perDay.length + ' sesiones</div>'
      + '<button class="copybtn" id="copybtn">Copiar resumen</button></div>'
      + '<div class="tabwrap"><table class="sumtab"><thead><tr><th>Día</th><th>Máximo (ET)</th><th>Mínimo (ET)</th><th>Vol</th><th>RVOL</th><th>Rango</th></tr></thead><tbody>'
      + tabRows + '</tbody></table></div>'
      + '<div class="reading" style="margin-top:10px">' + winText + '</div>'
      + '<div class="sumline">Máximos: ' + hiB.n + ' de ' + perDay.length + ' en ' + hiB.best
      + ' · Mínimos: ' + loB.n + ' de ' + perDay.length + ' en ' + loB.best + '</div>'
      + '<div class="sumline">Cierres sobre VWAP: ' + overVwap + ' de ' + perDay.length
      + ' · Gaps cerrados: ' + gapsFilled + ' de ' + gapsTot
      + ' · Rango promedio: ' + avgRangePct.toFixed(2) + '%</div>'
      + '<div class="sumline">Volumen promedio: ' + fmtVol(avgV) + '/sesión · tendencia: ' + trend + '</div>'
      + '</div>';

    // reporte copiable (texto plano)
    const repLines = [sym + " · " + perDay.length + " sesiones · " + shown[0] + " → " + shown[shown.length-1]];
    repLines.push("");
    repLines.push("VENTANA: " + winText);
    for (const x of perDay){
      let hdr = "— " + esDayLabel(x.ds);
      if (x.prev != null){
        const chg = x.c - x.prev;
        hdr += " (" + (chg>=0?"+":"") + (chg/x.prev*100).toFixed(2) + "%)";
      }
      repLines.push("");
      repLines.push(hdr);
      repLines.push(x.narrative);
    }
    lastReport = repLines.join("\n");
    document.getElementById("copybtn").addEventListener("click", async function(){
      const b = document.getElementById("copybtn");
      try {
        await navigator.clipboard.writeText(lastReport);
      } catch(e){
        const ta = document.createElement("textarea");
        ta.value = lastReport;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
      b.textContent = "Copiado ✓";
      setTimeout(function(){ b.textContent = "Copiar resumen"; }, 1500);
    });

    // ---- estadística extendida (30/60 días) ----
    const winSel = document.getElementById("statwin").value;
    if (winSel !== "win"){
      try {
        const ext = await extendedStats(sym, endMid, parseInt(winSel,10), msg => { status.textContent = msg; });
        const extShown = ext.filter(x => x.ds <= dateStr);
        if (extShown.length >= 10){
          const B = ["la apertura (9:30–10:30)","media mañana (10:30–12:00)","el mediodía (12:00–14:00)","la tarde (14:00–15:00)","la última hora (15:00–16:00)"];
          const hc = {}, lc = {};
          for (const b of B){ hc[b]=0; lc[b]=0; }
          for (const x of extShown){ hc[bucketFromMins(x.hiMins)]++; lc[bucketFromMins(x.loMins)]++; }
          const n = extShown.length;
          let dist = "";
          for (const b of B){
            const hp = hc[b]/n*100, lp = lc[b]/n*100;
            dist += '<tr><td>' + b + '</td>'
              + '<td style="background:linear-gradient(90deg, rgba(63,185,80,.22) ' + hp.toFixed(0) + '%, transparent ' + hp.toFixed(0) + '%)">' + hp.toFixed(0) + '% (' + hc[b] + ')</td>'
              + '<td style="background:linear-gradient(90deg, rgba(248,81,73,.22) ' + lp.toFixed(0) + '%, transparent ' + lp.toFixed(0) + '%)">' + lp.toFixed(0) + '% (' + lc[b] + ')</td></tr>';
          }
          const extAvgV = extShown.reduce((s,x)=>s+x.vTot,0)/n;
          const extAvgR = extShown.reduce((s,x)=>s+x.rangePct,0)/n;
          const dvv = extAvgV ? (avgV/extAvgV - 1)*100 : 0;
          document.getElementById("summary").insertAdjacentHTML("beforeend",
            '<div class="sumpanel">'
            + '<div class="sumtitle">Estadística extendida · ' + n + ' sesiones completas (últimos ' + winSel + ' días)</div>'
            + '<div class="tabwrap"><table class="sumtab"><thead><tr><th>Franja (ET)</th><th>Máximos</th><th>Mínimos</th></tr></thead><tbody>' + dist + '</tbody></table></div>'
            + '<div class="sumline">Volumen prom. ' + winSel + 'd: ' + fmtVol(extAvgV) + '/sesión · tus ' + perDay.length + ' sesiones: ' + fmtVol(avgV) + '/sesión (' + (dvv>=0?"+":"") + dvv.toFixed(0) + '% vs ' + winSel + 'd)</div>'
            + '<div class="sumline">Rango prom. ' + winSel + 'd: ' + extAvgR.toFixed(2) + '% · tus sesiones: ' + avgRangePct.toFixed(2) + '% (' + (avgRangePct >= extAvgR ? "volatilidad en expansión" : "volatilidad en contracción") + ')</div>'
            + '</div>');
          lastReport += "\n\nEXTENDIDO (" + winSel + "d, " + n + " sesiones): "
            + "volumen prom. " + fmtVol(extAvgV) + "/sesión vs " + fmtVol(avgV) + " en la ventana ("
            + (dvv>=0?"+":"") + dvv.toFixed(0) + "%); rango prom. " + extAvgR.toFixed(2) + "% vs "
            + avgRangePct.toFixed(2) + "% (" + (avgRangePct >= extAvgR ? "volatilidad en expansión" : "volatilidad en contracción") + ").";
        } else {
          document.getElementById("summary").insertAdjacentHTML("beforeend",
            '<div class="sumpanel"><div class="sumline">Análisis extendido: datos insuficientes en ese rango (¿fecha final muy antigua para 5m?).</div></div>');
        }
      } catch(e){
        document.getElementById("summary").insertAdjacentHTML("beforeend",
          '<div class="sumpanel"><div class="sumline">No se pudo cargar el análisis extendido: ' + e.message + '</div></div>');
      }
      status.className = "ok";
      status.textContent = "";
    }

    document.getElementById("foot").textContent =
      shown.length + " sesiones · " + sym + " · " + shown[0] + " → " + shown[shown.length-1]
      + " · orden cronológico · solo sesión regular (hora ET) · fuente: Yahoo Finance";
    status.textContent = "";
  } catch(e){
    status.className = "err";
    status.textContent = e.message;
    document.getElementById("summary").innerHTML = "";
    document.getElementById("foot").textContent = "";
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("go").addEventListener("click", run);
document.getElementById("symbol").addEventListener("keydown", e => { if (e.key==="Enter") run(); });
</script>
</body>
</html>
